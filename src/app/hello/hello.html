<p>Este é o meu primeiro projeto Angular!</p>

<h1>{{ title }}</h1>

<button [disabled]="isDisabled" (click)="onClick()"> Toggle</button><br>
<br>

<p> Contador: {{ contador() }}</p><br>
<p> Duplicar o Contador: {{ doubleContador() }}</p>

<button (click)="incrementar()"> + </button>
<button (click)="retirar()"> - </button>
<button (click)="resetarContador()"> Resetar</button><br>

<br>

<input (input)="aoDigitar($event)"/>
<p> Você digitou: {{ nome }}</p>
